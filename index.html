<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Affirmo">
<title>Affirmo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1B2150">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --serif:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --sans:"Figtree",-apple-system,"Segoe UI",Roboto,sans-serif;
  --text:#FFFFFF; --soft:rgba(255,255,255,.85); --shadow:0 1px 14px rgba(10,14,40,.4);
  --panel:#141A33; --panel-ink:#EEF0F8; --panel-line:rgba(255,255,255,.14); --accent:#FFB8C9;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0B1026; color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased; overflow:hidden;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
#sky{position:fixed; inset:0; transition:background 2s linear}
#stars{position:fixed; inset:0; pointer-events:none; transition:opacity 2s linear}
#stars i{position:absolute; width:2px; height:2px; border-radius:50%; background:#fff}
#rainbow{position:fixed; left:-20vw; width:140vw; aspect-ratio:2/1; pointer-events:none; opacity:0; transition:opacity 3s linear; filter:blur(1.5px)}
canvas.fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none}
#sun{position:fixed; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%;
  transition:left 2s linear, top 2s linear, background 2s linear, box-shadow 2s linear, opacity 2s linear}
#mountains{position:fixed; left:0; right:0; bottom:0; height:56vh; min-height:340px}
#mountains svg{width:100%; height:100%; display:block}
#tree{transform-box:view-box; animation:sway var(--swd,7s) ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(calc(var(--sw,1) * -.8deg))} to{transform:rotate(calc(var(--sw,1) * 1.1deg))}}
.blades{transform-box:fill-box; transform-origin:50% 100%; animation:grass 3.8s ease-in-out infinite alternate}
.blades.b2{animation-duration:4.6s; animation-delay:-1.3s}
.blades.b3{animation-duration:3.2s; animation-delay:-2.1s}
@keyframes grass{from{transform:skewX(calc(var(--sw,1) * -3deg))} to{transform:skewX(calc(var(--sw,1) * 4deg))}}
#front{z-index:1}
#fog{position:fixed; left:0; right:0; bottom:0; height:70vh; pointer-events:none; opacity:0; transition:opacity 3s linear;
  background:linear-gradient(to top, rgba(225,230,238,.92) 0%, rgba(225,230,238,.75) 45%, rgba(225,230,238,0) 100%)}
#flash{position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none}
.meta{display:flex; align-items:baseline; gap:.6rem}
.temp{font-size:.95rem; color:var(--soft)}
.head-right{display:flex; align-items:center; gap:.2rem}
.gear{padding:.35rem; margin-right:-.35rem}
.gear svg{width:20px; height:20px}
.opt-group{margin:0 0 2rem}
.opt-group h3{font:600 .95rem var(--sans); margin-bottom:.75rem; color:rgba(238,240,248,.75)}
.seg{display:flex; gap:.5rem; flex-wrap:wrap}
.seg button{background:none; border:1px solid var(--panel-line); color:var(--panel-ink); font:500 .95rem var(--sans); padding:.6rem 1rem; border-radius:999px; cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel-ink); color:var(--panel); border-color:var(--panel-ink)}
.seg button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.note{font-size:.85rem; color:rgba(238,240,248,.6); line-height:1.5; margin-top:.6rem; max-width:40ch}
.note a{color:inherit}
.app{position:relative; z-index:2; height:100dvh; max-width:640px; margin:0 auto;
  display:grid; grid-template-rows:auto 1fr auto; padding:calc(env(safe-area-inset-top) + 1.25rem) 1.5rem 0}
header{display:flex; justify-content:space-between; align-items:baseline; gap:1rem; text-shadow:var(--shadow)}
.date{font-size:.95rem; font-weight:500; color:var(--soft)}
.streak{font-size:.9rem; color:var(--soft); display:flex; align-items:center; gap:.35rem}
.streak svg{width:14px; height:14px; fill:var(--accent)}
main{display:flex; align-items:flex-start; padding-top:10vh; touch-action:pan-y}
.quote-wrap{display:flex; flex-direction:column; align-items:flex-start}
blockquote{font-family:var(--serif); font-style:italic; font-weight:500;
  font-size:clamp(2.1rem, 8.5vw, 3.4rem); line-height:1.12; letter-spacing:-.01em;
  max-width:18ch; text-wrap:balance; text-shadow:var(--shadow); transition:opacity .35s ease, transform .35s ease}
blockquote.out{opacity:0; transform:translateY(6px)}
.hint{margin-top:1.1rem; font-size:.95rem; color:var(--soft); text-shadow:var(--shadow); min-height:1.4em; max-width:30ch; line-height:1.4}
.hint.breath{font-family:var(--serif); font-style:italic; font-size:1.5rem; color:#fff}
.back-today{margin-top:.35rem; display:none; background:none; border:0; color:var(--text);
  font:500 .9rem var(--sans); text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:.25rem 0; text-shadow:var(--shadow)}
.past .back-today{display:inline-block}
nav{margin:0 -1.5rem; padding:.8rem 1.25rem calc(env(safe-area-inset-bottom) + 1rem);
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:.5rem;
  background:linear-gradient(to top, rgba(8,14,20,.5), rgba(8,14,20,0))}
nav .side{display:flex; gap:.15rem; align-items:center}
nav .side.right{justify-content:flex-end}
.btn{background:none; border:0; cursor:pointer; color:#fff; font:500 .9rem var(--sans);
  padding:.65rem .75rem; border-radius:999px; display:inline-flex; align-items:center; gap:.4rem}
.btn:hover{background:rgba(255,255,255,.14)}
.btn:focus-visible, .close:focus-visible, .hold:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.btn[hidden]{display:none}
.btn svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.btn.on svg{fill:var(--accent); stroke:var(--accent)}
.hold{position:relative; width:72px; height:72px; border-radius:50%; border:0; cursor:pointer;
  background:rgba(255,255,255,.12); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  touch-action:none; display:grid; place-items:center; transition:transform .3s ease, background .3s}
.hold svg.ring{position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg)}
.hold .track{fill:none; stroke:rgba(255,255,255,.35); stroke-width:2.5}
.hold .prog{fill:none; stroke:var(--accent); stroke-width:3.5; stroke-linecap:round}
.hold .core{width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.9); transition:transform .2s linear}
.hold.done{background:rgba(255,184,201,.28)}
.hold .wave, .hold .wave2{position:absolute; left:50%; top:50%; width:72px; height:72px; margin:-36px 0 0 -36px;
  border-radius:48% 52% 50% 50% / 50% 47% 53% 50%; pointer-events:none; opacity:0; scale:1; transition:opacity .6s ease}
.hold .wave{background:radial-gradient(circle, rgba(255,222,232,.55) 0%, rgba(255,184,201,.32) 50%, rgba(255,184,201,0) 71%); animation:blob 7s linear infinite}
.hold .wave2{border:1.5px solid rgba(255,255,255,.55); animation:blob 9s linear infinite reverse}
.hold.breathing .wave, .hold.breathing .wave2{opacity:1}
@keyframes blob{
  0%{transform:rotate(0deg); border-radius:48% 52% 50% 50% / 50% 47% 53% 50%}
  33%{border-radius:53% 47% 46% 54% / 47% 54% 46% 53%}
  66%{border-radius:46% 54% 53% 47% / 54% 48% 52% 46%}
  100%{transform:rotate(360deg); border-radius:48% 52% 50% 50% / 50% 47% 53% 50%}}
.app::before{content:""; position:fixed; left:0; right:0; top:0; height:58vh; pointer-events:none; z-index:-1;
  background:linear-gradient(to bottom, rgba(10,14,40,.30) 0%, rgba(10,14,40,.18) 55%, rgba(10,14,40,0) 100%)}
.hold.done .core{background:var(--accent)}
.toast{position:fixed; z-index:5; left:50%; bottom:calc(env(safe-area-inset-bottom) + 7.5rem); transform:translate(-50%,10px);
  background:var(--panel); color:var(--panel-ink); font-size:.9rem; padding:.6rem 1.1rem; border-radius:999px;
  opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; width:max-content; max-width:calc(100vw - 3rem); text-align:center; line-height:1.35; border-radius:1.2rem}
.toast.show{opacity:1; transform:translate(-50%,0)}
.sheet{position:fixed; inset:0; z-index:10; overflow-y:auto; background:var(--panel); color:var(--panel-ink);
  padding:calc(env(safe-area-inset-top) + 1.25rem) 1.5rem calc(env(safe-area-inset-bottom) + 2rem);
  transform:translateY(100%); transition:transform .4s cubic-bezier(.2,.7,.2,1); visibility:hidden; -webkit-user-select:text; user-select:text}
.sheet.open{transform:none; visibility:visible}
.sheet-inner{max-width:640px; margin:0 auto}
.sheet-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem}
.sheet h2{font-family:var(--serif); font-style:italic; font-weight:600; font-size:2rem}
.close{background:none; border:1px solid var(--panel-line); color:var(--panel-ink); font:500 .9rem var(--sans); padding:.5rem .9rem; border-radius:999px; cursor:pointer}
.fav-list{list-style:none}
.fav-list li{border-top:1px solid var(--panel-line); padding:1rem 0; display:flex; gap:1rem; justify-content:space-between; align-items:flex-start}
.fav-list li:last-child{border-bottom:1px solid var(--panel-line)}
.fav-list p{font-family:var(--serif); font-style:italic; font-size:1.4rem; line-height:1.25}
.fav-list button{background:none; border:0; color:rgba(238,240,248,.7); font:500 .85rem var(--sans); cursor:pointer; padding:.3rem 0; white-space:nowrap}
.empty{color:rgba(238,240,248,.7); line-height:1.6; max-width:36ch}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>
<body>
<div id="sky"></div>
<div id="stars" aria-hidden="true"></div>
<svg id="rainbow" viewBox="0 0 1000 500" aria-hidden="true">
  <g fill="none" stroke-width="9" opacity=".75">
    <circle cx="500" cy="500" r="470" stroke="#FF5A5A"/><circle cx="500" cy="500" r="461" stroke="#FF9F43"/>
    <circle cx="500" cy="500" r="452" stroke="#FFE66D"/><circle cx="500" cy="500" r="443" stroke="#6BD66B"/>
    <circle cx="500" cy="500" r="434" stroke="#4DB8FF"/><circle cx="500" cy="500" r="425" stroke="#6C6CFF"/>
    <circle cx="500" cy="500" r="416" stroke="#B57CFF"/>
  </g>
</svg>
<canvas class="fx" id="back" aria-hidden="true"></canvas>
<div id="sun" aria-hidden="true"></div>
<div id="mountains" aria-hidden="true">
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice">
    <defs id="defs"></defs>
    <g id="layers"></g>
    <path id="meadow"/>
    <g id="grass"></g>
    <g id="tree"></g>
  </svg>
</div>
<div id="fog" aria-hidden="true"></div>
<canvas class="fx" id="front" aria-hidden="true"></canvas>
<div id="flash" aria-hidden="true"></div>

<div class="app">
  <header>
    <span class="meta"><span class="date" id="date"></span><span class="temp" id="temp"></span></span>
    <span class="head-right">
      <span class="streak" id="streak"></span>
      <button class="btn gear" id="openSettings" aria-label="Réglages">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      </button>
    </span>
  </header>
  <main id="main">
    <div class="quote-wrap" id="wrap">
      <blockquote id="quote" aria-live="polite"></blockquote>
      <p class="hint" id="hint" aria-live="polite"></p>
      <button class="back-today" id="today"></button>
    </div>
  </main>
  <nav>
    <div class="side">
      <button class="btn" id="prev" aria-label="Affirmation de la veille">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="btn" id="next" aria-label="Revenir vers aujourd’hui" hidden>
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <button class="btn" id="openFavs"></button>
    </div>
    <button class="hold" id="hold" aria-label="Maintenir 10 secondes pour respirer avec l’affirmation">
      <span class="wave" id="wave"></span><span class="wave2" id="wave2"></span>
      <svg class="ring" viewBox="0 0 72 72"><circle class="track" cx="36" cy="36" r="33"/><circle class="prog" id="prog" cx="36" cy="36" r="33"/></svg>
      <span class="core" id="core"></span>
    </button>
    <div class="side right">
      <button class="btn" id="fav" aria-pressed="false" aria-label="Garder dans mes favoris">
        <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
      </button>
      <button class="btn" id="share" aria-label="Partager">
        <svg viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M5 12v7h14v-7"/></svg>
      </button>
    </div>
  </nav>
</div>

<section class="sheet" id="sheet" aria-hidden="true" aria-labelledby="favTitle">
  <div class="sheet-inner">
    <div class="sheet-head">
      <h2 id="favTitle"></h2>
      <button class="close" id="closeFavs"></button>
    </div>
    <ul class="fav-list" id="favList"></ul>
    <p class="empty" id="empty"></p>
  </div>
</section>
<section class="sheet" id="settings" aria-hidden="true" aria-labelledby="setTitle">
  <div class="sheet-inner">
    <div class="sheet-head">
      <h2 id="setTitle"></h2>
      <button class="close" id="closeSettings"></button>
    </div>
    <div class="opt-group">
      <h3 id="langTitle"></h3>
      <div class="seg"><button data-lang="fr">Français</button><button data-lang="en">English</button></div>
    </div>
    <div class="opt-group">
      <h3 id="locTitle"></h3>
      <div class="seg"><button id="locDefault"></button><button id="locMine"></button></div>
      <p class="note" id="locNote"></p>
    </div>
    <p class="note" id="credit"></p>
  </div>
</section>
<div class="toast" id="toast" role="status"></div>

<script>
/* ================= Données ================= */

/* ================= Maintien 10 secondes ================= */
const C = 2 * Math.PI * 33;
$("prog").style.strokeDasharray = C; $("prog").style.strokeDashoffset = C;
let holding = false, holdStart = 0, holdRaf = 0;
function holdFrame(){
  if (!holding) return;
  const ms = performance.now() - holdStart, p = Math.min(1, ms / HOLD_MS);
  $("prog").style.strokeDashoffset = C * (1 - p);
  const inhale = ms < 4000;
  setHint(inhale ? t().inhale : t().exhale, true);
  // Respiration : 4 s d'inspiration, 6 s d'expiration, en douceur
  const b = inhale ? (1 - Math.cos(Math.PI * ms / 4000)) / 2 : (1 + Math.cos(Math.PI * Math.min(1, (ms - 4000) / 6000))) / 2;
  $("core").style.transform = `scale(${1 + b * .45})`;
  $("wave").style.scale = (1 + b * 3.4).toFixed(3);
  $("wave2").style.scale = (1.08 + b * 3.9).toFixed(3);
  if (p >= 1){ holding = false; complete(); return; }
  holdRaf = requestAnimationFrame(holdFrame);
}
function startHold(e){
  e.preventDefault();
  if (back > 0){ toast(t().goToday); return; }
  if (doneToday()){ toast(t().already); return; }
  holding = true; holdStart = performance.now();
  $("hold").classList.add("breathing");
  try { $("hold").setPointerCapture(e.pointerId); } catch(_){}
  holdRaf = requestAnimationFrame(holdFrame);
}
function endWave(){
  $("hold").classList.remove("breathing");
  ["wave","wave2"].forEach(id => { $(id).style.transition = "opacity .6s ease, scale .8s ease"; $(id).style.scale = 1; setTimeout(() => $(id).style.transition = "", 900); });
}
function cancelHold(){
  if (!holding) return;
  holding = false; cancelAnimationFrame(holdRaf);
  endWave();
  $("prog").style.strokeDashoffset = C; $("core").style.transform = "";
  setHint(t().keep);
}
$("hold").addEventListener("pointerdown", startHold);
["pointerup","pointercancel","lostpointercapture"].forEach(ev => $("hold").addEventListener(ev, cancelHold));
$("hold").addEventListener("contextmenu", e => e.preventDefault());
$("hold").addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && !holding && !e.repeat){ startHold(e); } });
$("hold").addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") cancelHold(); });

function complete(){
  const before = totalDays();
  if (!P.get("g")){ days.add(keyOf(logical(now()))); store.set("aube-days", [...days]); }
  endWave();
  $("core").style.transform = ""; $("prog").style.strokeDashoffset = 0;
  setTimeout(() => { $("prog").style.strokeDashoffset = C; }, 1200);
  growTo(before, before + 1);
  burst(24);
  const s = streak();
  toast(s > 1 ? t().wellStreak(s) : t().wellStarted);
  renderQuote(false);
}

function annivYears(){
  if (P.get("anniv")) return parseInt(P.get("anniv"), 10) || 1;
  const first = [...days].sort()[0]; if (!first) return 0;
  const [y, m, d] = first.split("-").map(Number), L = logical(now());
  return L.getMonth() === m - 1 && L.getDate() === d && L.getFullYear() > y ? L.getFullYear() - y : 0;
}
let annivN = annivYears();
function annivToast(){
  annivN = annivYears();
  if (!annivN) return;
  const k = keyOf(logical(now()));
  if (!P.get("anniv") && store.get("aube-anniv-seen", "") === k) return;
  store.set("aube-anniv-seen", k);
  setTimeout(() => toast(t().anniv(annivN)), 1200);
}

function sunPos(date){

  const eps = (23.439 - 0.0000004 * n) * rad;
  const ra = Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam));
  const dec = Math.asin(Math.sin(eps) * Math.sin(lam));

let WX = store.get("aube-wx", null);
if (WX && Date.now() - WX.t > 3 * 3600000) WX = null;
const PRESETS = {
  clear:  { cloud: 5,   code: 0,  precip: 0, wind: 8,  temp: 14 },
  cloudy: { cloud: 90,  code: 3,  precip: 0, wind: 14, temp: 11 },
  rain:   { cloud: 100, code: 63, precip: 2, wind: 22, temp: 9 },
  snow:   { cloud: 100, code: 73, precip: 1, wind: 10, temp: -2 },
  fog:    { cloud: 100, code: 45, precip: 0, wind: 3,  temp: 5 },
  storm:  { cloud: 100, code: 95, precip: 6, wind: 45, temp: 17 }
};
if (P.get("w") && PRESETS[P.get("w")]) WX = { ...PRESETS[P.get("w")], t: Date.now() };
function wxKind(){
  if (!WX) return "none";
  const c = WX.code;
  if (c >= 95) return "storm";
  if ((c >= 71 && c <= 77) || c === 85 || c === 86) return "snow";
  if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82)) return "rain";
  if (c === 45 || c === 48) return "fog";
  return "clear";
}
function wxIntensity(){
  if (!WX) return 0;
  const c = WX.code, last = c % 10;
  return Math.max(.3, Math.min(1, (WX.precip || 0) / 4 + (last >= 5 ? .6 : last >= 3 ? .4 : .25)));
}
async function fetchWeather(){
  if (P.get("w")){ applyWeather(); return; }
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,cloud_cover,precipitation,weather_code,wind_speed_10m&wind_speed_unit=kmh&timezone=auto`;
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const c = (await r.json()).current;
    WX = { cloud: c.cloud_cover, code: c.weather_code, precip: c.precipitation, wind: c.wind_speed_10m, temp: c.temperature_2m, t: Date.now() };
    store.set("aube-wx", WX);
  } catch(e){ /* hors ligne ou bloqué : on garde le dernier relevé ou le décor par défaut */ }
  applyWeather();
}
function renderTemp(){ $("temp").textContent = WX && typeof WX.temp === "number" ? Math.round(WX.temp) + "°" : ""; }
function applyWeather(){
  const over = WX ? WX.cloud / 100 : 0;
  const kind = wxKind();
  // Nuages : nombre et place selon la couverture réelle
  const target = WX ? Math.round(1 + over * 9) : clouds.length;
  if (WX){
    clouds.length = 0;
    let sd = (dayNumber(now()) * 9301 + 49297 + target) % 233280;
    const r = () => (sd = (sd * 9301 + 49297) % 233280) / 233280;
    for (let i = 0; i < target; i++){
      clouds.push({ x: r() * 1.3 - .15, y: r(), s: .45 + r() * .55 + over * .3,
        v: .004 + r() * .006, a: 1,
        puffs: Array.from({ length: 5 }, (_, k) => [k * 18 - 36 + r() * 8, -r() * 14 - (k === 2 ? 10 : 0), 14 + r() * 12]) });
    }
  }
  // Vent réel → balancement
  const wind = WX ? WX.wind : 15;
  const sw = Math.max(.4, Math.min(3.2, wind / 14));
  document.documentElement.style.setProperty("--sw", sw.toFixed(2));
  document.documentElement.style.setProperty("--swd", Math.max(2.2, 8 - wind / 8).toFixed(1) + "s");
  $("fog").style.opacity = kind === "fog" ? 1 : kind === "rain" || kind === "snow" ? .25 : 0;
  renderTemp();
  paint();
}
function windPx(tm){ const base = WX ? 6 + WX.wind * 1.3 : 22; return base + Math.sin(tm / 5000) * base * .5 + Math.sin(tm / 1300) * base * .2; }

/* ================= Peinture du paysage ================= */
for (let i = 0; i < 90; i++){
  const s = document.createElement("i");
  s.style.left = (rnd() * 100) + "%"; s.style.top = (rnd() * 55) + "%";
  s.style.opacity = (.35 + rnd() * .65).toFixed(2);
  if (rnd() > .85) s.style.width = s.style.height = "3px";
  $("stars").append(s);
}
function paint(){
  const d = now(), { el: e, az } = sunPos(d);
  const doy = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
  let [top, mid, hor] = ramp(SKY, e);
  const over = WX ? WX.cloud / 100 : 0, kind = wxKind();
  if (over > 0){
    const grey = c => { const [r, g, b] = hex(c); const l = (r * .3 + g * .59 + b * .11); return toHex([l, l, l * 1.04]); };
    const k = over * (kind === "storm" ? .75 : kind === "rain" || kind === "snow" ? .65 : .5);
    top = mix(top, grey(top), k); mid = mix(mid, grey(mid), k); hor = mix(hor, grey(hor), k);
    if (kind === "storm" || kind === "rain"){ top = mix(top, "#2A2F3A", .25); mid = mix(mid, "#3A404C", .2); }
  }
  skyCol = { hor, el: e };
  $("sky").style.background = `linear-gradient(to bottom, ${top} 0%, ${mid} 48%, ${hor} 82%)`;
  $("stars").style.opacity = Math.max(0, Math.min(1, (-e - 5) / 8)) * (1 - over * .9);

  const mt = $("mountains").getBoundingClientRect();
  const horizon = mt.top + mt.height * .36, high = innerHeight * .38;
  const x = 8 + Math.max(0, Math.min(1, (az - 70) / 220)) * 84;
  const y = horizon - (Math.min(e, 70) / 70) * (horizon - high);
  const sunC = ramp([[-2, "#FF8A4C"], [6, "#FFB870"], [20, "#FFF1CC"], [40, "#FFFBEE"]], e);
  const sEl = $("sun");
  sEl.style.left = x + "vw"; sEl.style.top = y + "px"; sEl.style.background = sunC;
  sEl.style.boxShadow = `0 0 40px 18px ${sunC}66, 0 0 120px 60px ${sunC}33`;
  sEl.style.opacity = e > -4 ? (1 - over * .85).toFixed(2) : 0;

  // Arc-en-ciel (jour d'anniversaire, en journée)
  annivN = annivYears();
  const rb = $("rainbow");
  rb.style.top = (mt.top + mt.height * .42 - rb.getBoundingClientRect().height) + "px";
  rb.style.opacity = annivN ? (Math.max(0, Math.min(1, (e - 1) / 6)) * (1 - over * .3) * .8).toFixed(2) : 0;

  const S = seasonAt(doy);
  const dark = Math.max(0, Math.min(.82, (6 - e) / 18 * .82));
  const warm = e > -5 && e < 9 ? .18 * (1 - Math.abs(e - 2) / 7) : 0;
  const light = c => mix(warm > 0 ? mix(c, "#E89A8A", warm) : c, "#0A0F2C", dark);
  const haze = "#A9BCDA";
  layerEls.forEach((L, i) => {
    const rock = S.rock[i], forest = mix(S.forest, haze, HAZE[i]);
    const cols = [rock, rock, forest, mix(forest, "#000000", .12)];
    L.stops.forEach((s, k) => s.setAttribute("stop-color", light(cols[k])));
    L.snow.setAttribute("fill", mix(mix("#F4F7FB", "#FFD9C4", warm * 1.4), "#1E2750", dark * .9));
    // Neige cohérente avec l'altitude : les plans lointains (plus hauts) en gardent le plus,
    // les contreforts n'en ont qu'au cœur de l'hiver
    const amt = [Math.min(1, S.snow * 1.5), Math.min(1, S.snow * 1.2), Math.max(0, S.snow - .6), Math.max(0, S.snow - .85) * .8][i];
    L.cp.setAttribute("d", snowClip(L, amt <= .02 ? -40 : L.top + amt * (L.base - L.top) * .5));
  });
  $("mg0").setAttribute("stop-color", light(S.meadow[0]));
  $("mg1").setAttribute("stop-color", light(S.meadow[1]));
  document.querySelectorAll(".blade").forEach(b => b.setAttribute("stroke", light(mix(S.meadow[1], "#2E5A24", .3))));
  $("tree").style.filter = dark > .2 ? `brightness(${(1 - dark * .7).toFixed(2)})` : "";
}

/* ================= Démarrage ================= */
applyLang();
drawTree(totalDays());
renderQuote(false);
if (WX) applyWeather(); else paint();
fetchWeather();
annivToast();
requestAnimationFrame(frame);
setInterval(() => { paint(); if (back === 0 && !holding) renderQuote(false); }, 60000);
setInterval(fetchWeather, 15 * 60000);
if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude\.ai|claudeusercontent/.test(location.hostname)){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
addEventListener("resize", () => { resize(); paint(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden){ paint(); renderQuote(false); if (!WX || Date.now() - WX.t > 10 * 60000) fetchWeather(); } });
</script>
</body>
